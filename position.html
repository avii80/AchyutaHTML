<!DOCTYPE html>
<html>
<head>
<title>The Mount Caramel Book Club</title>
<style>
div{
right: 30px;
border: 3px solid #73ad31;
}
div.absolute{
position: absolute;
left: 50px;
border: 3px solid pink;
}
div.relative{
position: relative;
left: 100px;
border: 3px solid #7a55d1;
}
div.fixed{
position: fixed;
top: 0;
right: 20px;
width: 300px;
border:3px solid #e905f9c1;
}
div.sticky{
position: sticky;
top: 1px;
left: 20px;
width: 100px;
border:3px solid #7a55d1;
}

</style>
</head>
<body>

<h2>POSITIONING</h2>

<div>

Div with no position property

</div>

<div class="sticky">

Div with sticky position property

</div>

<div class="relative">

This div element has position: relative;

<div class="absolute">

Absolute class DIV

</div>

</div>

<div class="fixed">

Div with fixed position property

</div>

<div style="height: 1800px; border: none;">

</div>

</body>

</html>
